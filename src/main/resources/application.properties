spring.application.name=mesafacil
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mesa_facil}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

logging.file.name=mesafacil.log

app.admin.name=${ADMIN_NAME:Administrador}
app.admin.email=${ADMIN_EMAIL:admin@mesafacil.com}
app.admin.password=${ADMIN_PASSWORD:admin123}
